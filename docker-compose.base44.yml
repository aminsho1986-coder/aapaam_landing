services:
  web:
    image: node:18-slim
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_DOMAIN=https://aapaam.net
      - NEXT_PUBLIC_BASE_URL=https://aapaam.net/api/
      - NEXT_PUBLIC_BASE_URL_IMAGES=https://aapaam.net/public/projects/
    command: sh -c "npm install && npx next dev -H 0.0.0.0 -p 3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
